<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    nav {
      display: flex;
      justify-content: space-between;
      padding: 25px 10px;
    }

    #cards {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card {
      width: calc(25% - 8px);
      border-radius: 15px;
      border: 1px solid #000000;
      overflow: hidden;
    }

    .content {
      padding: 10px;
    }

    .content-b {
      display: flex;
      justify-content: space-between;
    }

    .img {
      width: 100%;
      height: 70px;
    }

    .btn {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <nav>
    <div>我是導覽列</div>
    <div>
      <!-- 購物車(有的話才會有後面這個框框) -->
      購物車
      <span id="total"></span>
    </div>
  </nav>
  <section id="cards">
    <div class="card">
      <img class="img" src="" alt="">
      <div class="content">
        <div>我是名稱</div>
        <div class="content-b">
          <span>$10000</span>
          <button class="btn" type="button">※</button>
        </div>
      </div>
    </div>
    <div class="card">
      <img class="img" src="" alt="">
      <div class="content">
        <div>我是名稱</div>
        <div class="content-b">
          <span>$10000</span>
          <button class="btn" type="button">※</button>
        </div>
      </div>
    </div>
    <div class="card">
      <img class="img" src="" alt="">
      <div class="content">
        <div>我是名稱</div>
        <div class="content-b">
          <span>$10000</span>
          <button class="btn" type="button">※</button>
        </div>
      </div>
    </div>
    <div class="card">
      <img class="img" src="" alt="">
      <div class="content">
        <div>我是名稱</div>
        <div class="content-b">
          <span>$10000</span>
          <button class="btn" type="button">※</button>
        </div>
      </div>
    </div>
    <div class="card">
      <img class="img" src="./img/cat-05.PNG" alt="">
      <div class="content">
        <div>我是名稱</div>
        <div class="content-b">
          <span>$10000</span>
          <button class="btn" type="button">※</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    // 商品資料放在這裡就可以了
    const cats = [{
        'id': 1,
        'img': './img/cat-01.PNG',
        'name': '01',
        'price': '1000'
      },
      {
        'id': 2,
        'img': './img/cat-02.PNG',
        'name': '02',
        'price': '1500'
      },
      {
        'id': 3,
        'img': './img/cat-03.PNG',
        'name': '03',
        'price': '1600'
      },
      {
        'id': 4,
        'img': './img/cat-04.PNG',
        'name': '04',
        'price': '800'
      },
      {
        'id': 5,
        'img': './img/cat-05.PNG',
        'name': '05',
        'price': '400'
      },
    ];

    // 買家的購物單
    let shopping = [];


    // 1-1.將購物資料放入頁面，必趨要找頁面卡片區
    const cards = document.querySelector('#cards');
    // 1-2購物車數量
    const total = document.querySelector('#total');

    // null => 空的，甚麼都沒有
    // true => 1 => 如果存在東西
    // false => 0 => 如果存在東西

    let a = null; // 空，沒有東西
    let b = 0.0001;
    let c = ''; // 沒有字串，沒有東西
    let d = 0; // 0 => 沒有東西

    if (a) { // 如果 有 a
      console.log(1, a);
    }

    if (b) { // 如果 有 b
      console.log(2,b);
    }
    if (c) { // 如果 有 c
      console.log(3,c);
    }
    if (d) { // 如果 有 d
      console.log(4,d);
    }

    // 1-3. 把購物車數量從暫存器讀出來
    let shoppingTemp = localStorage.getItem('shopping');
    console.log(111, shoppingTemp);
    // 現在要將 shoppingTemp 轉成物件，要需有東西才能轉，
    // 如果沒有東西，那一定會錯，因為沒有東西可以parse()
  console.log(999, shoppingTemp);
   if (shoppingTemp) {
    shopping = JSON.parse(shoppingTemp);
    // 顯示在網頁上
    totalShow();
   }

    // 頁面卡片區先清空
    cards.innerHTML = '';

    cats.forEach((item, index) => {
      cards.innerHTML +=
        `
        <div class="card">
            <img class="img" src="${item.img}" alt="">
            <div class="content">
                <div>${item.name}</div>
                <div class="content-b">
                    <span>$${item.price}</span>
                    <button class="btn" type="button">※${index}</button>
                </div>
            </div>
        </div>
        `
    });

    // 2.長完卡片之後，必須找到所有的按鈕，綁上事件監聽器
    const btnAll = document.querySelectorAll('.btn');
    // 得到的是類陣列 => 很像陣列的陣列, 只有一部分陣列的功能
    console.log(typeof (btnAll), btnAll);
    // 如果要將 類陣列 轉成 真正的陣列
    console.log(Array.from(btnAll));
    const btnAllReal = Array.from(btnAll);

    btnAll.forEach((btn, index) => {
      btn.addEventListener('click', function () {

        shopping.push(index + 1);
        console.log(shopping);

        // 存入暫存 =>陣列要轉成ＪＳＯＮ字串
        localStorage.setItem('shopping', JSON.stringify(shopping));

        // 3.要將書量放到網要上購物車 (個數) 裡面
        totalShow();
      })
    });


    function totalShow() {
      if (shopping.length > 0) {
        total.innerHTML = `(${shopping.length})`;
      }
    }
  </script>
</body>

</html>
